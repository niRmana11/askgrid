[project]
name = "askgrid-server"
version = "0.1.0"
description = "AskGrid deterministic AI spreadsheet analysis API"
authors = [
    { name = "Nirmana Herath", email = "nirmanaherath123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
